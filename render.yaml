services:
  # Backend API Service
  - type: web
    name: bakers-nest-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    rootDir: backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: MONGODB_URI
        sync: false # Set this manually in Render dashboard
      - key: RAZORPAY_KEY_ID
        sync: false # Set this manually in Render dashboard
      - key: RAZORPAY_KEY_SECRET
        sync: false # Set this manually in Render dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # Set this manually in Render dashboard
      - key: CLOUDINARY_API_KEY
        sync: false # Set this manually in Render dashboard
      - key: CLOUDINARY_API_SECRET
        sync: false # Set this manually in Render dashboard
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false # Set this manually in Render dashboard
      - key: AUTH0_DOMAIN
        sync: false # Set this manually in Render dashboard
      - key: AUTH0_CLIENT_ID
        sync: false # Set this manually in Render dashboard
      - key: ADMIN_EMAILS
        sync: false # Set this manually in Render dashboard
      - key: FREE_ORDER_EMAILS
        sync: false # Set this manually in Render dashboard
      - key: CORS_ORIGINS
        sync: false # Set this manually in Render dashboard
    healthCheckPath: /ping
    autoDeploy: true

  # Frontend Static Site
  - type: web
    name: bakers-nest-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    rootDir: frontend
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false # Set this manually in Render dashboard
      - key: REACT_APP_FRONTEND_URL
        sync: false # Set this manually in Render dashboard
      - key: REACT_APP_AUTH0_DOMAIN
        sync: false # Set this manually in Render dashboard
      - key: REACT_APP_AUTH0_CLIENT_ID
        sync: false # Set this manually in Render dashboard
      - key: REACT_APP_RAZORPAY_KEY_ID
        sync: false # Set this manually in Render dashboard
      - key: REACT_APP_EMAIL1
        sync: false # Set this manually in Render dashboard
      - key: REACT_APP_EMAIL2
        sync: false # Set this manually in Render dashboard
    autoDeploy: true
